<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Patang Utsav! 🪁</title>
    
    <!-- Meta Tags -->
    <meta property="og:title" content="✨ Happy Makar Sankranti! 🪁">
    <meta property="og:description" content="Sending you joy, colors, and festive vibes! Open your special surprise. 🌞✨">
    <meta property="og:image" content="https://images.unsplash.com/photo-1610992323497-626244673322?q=80&w=1200&auto=format&fit=crop">
    <meta property="og:type" content="website">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Rozha+One&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --pop-pink: #FF007F;
            --pop-yellow: #FFD700;
            --pop-blue: #00E5FF;
            --pop-orange: #FF5E00;
            --pop-purple: #8A2BE2;
            --bg-pattern: #2c2c54;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background-color: var(--bg-pattern);
            background-image: 
                linear-gradient(135deg, #30305b 25%, transparent 25%), 
                linear-gradient(225deg, #30305b 25%, transparent 25%), 
                linear-gradient(45deg, #30305b 25%, transparent 25%), 
                linear-gradient(315deg, #30305b 25%, transparent 25%);
            background-position:  10px 0, 10px 0, 0 0, 0 0;
            background-size: 20px 20px;
            background-repeat: repeat;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            user-select: none;
        }

        #skyCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        /* --- Decorations --- */
        .toran-container {
            position: absolute;
            top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-around;
            z-index: 5; pointer-events: none;
        }

        .toran-piece {
            width: 0; height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--pop-pink);
            transform-origin: top center;
            animation: sway 3s ease-in-out infinite;
            transition: border-top-color 0.3s;
        }
        .toran-piece:nth-child(even) { border-top-color: var(--pop-yellow); animation-delay: 0.5s; }
        .toran-piece:nth-child(3n) { border-top-color: var(--pop-blue); animation-delay: 1s; }

        @keyframes sway { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(-5deg); } }

        /* --- Container & Layout --- */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 450px;
            perspective: 1000px;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        /* --- Rich Premium Pop Art Card --- */
        .card {
            color: #222;
            padding: 2.5rem 2rem;
            text-align: center;
            
            /* Premium Flowing Border Setup */
            border: 6px solid transparent;
            border-radius: 16px;
            
            /* Background Layers (Top to Bottom) */
            background-image: 
                /* 1. Dot Pattern 1 */
                radial-gradient(rgba(0, 229, 255, 0.2) 1.5px, transparent 1.5px),
                /* 2. Dot Pattern 2 */
                radial-gradient(rgba(0, 229, 255, 0.2) 1.5px, transparent 1.5px),
                /* 3. White Background (Covers content area) */
                linear-gradient(#fff, #fff),
                /* 4. Flowing Gradient (Visible in border area) */
                linear-gradient(45deg, var(--pop-pink), var(--pop-yellow), var(--pop-blue), var(--pop-orange), var(--pop-pink), var(--pop-yellow));
            
            /* Assign each background to correct box model */
            background-origin: padding-box, padding-box, padding-box, border-box;
            background-clip: border-box, border-box, padding-box, border-box;
            /* Size the border gradient larger than box to allow movement */
            background-size: 20px 20px, 20px 20px, 100% 100%, 400% 400%;
            background-position: 0 0, 10px 10px, 0 0, 0% 50%;
            
            /* Deep 3D Shadow */
            box-shadow: 
                15px 15px 0px var(--pop-purple),
                20px 20px 30px rgba(0,0,0,0.4);
            
            position: relative; 
            pointer-events: auto;
            width: 100%;
            display: none; 
            opacity: 0;
            
            max-height: 80vh; 
            overflow-y: auto;
            overflow-x: hidden; 
        }
        
        .card::-webkit-scrollbar { display: none; }

        .card.active {
            display: block;
            opacity: 1;
            /* Combined Animations: Entrance + Float + Border Flow */
            animation: 
                premiumEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                floatCard 4s ease-in-out infinite 0.8s,
                flowBorderAnim 3s linear infinite; 
        }

        @keyframes premiumEntrance {
            0% { transform: scale(0.1) rotate(-15deg); opacity: 0; filter: blur(10px); }
            70% { transform: scale(1.05) rotate(2deg); opacity: 1; filter: blur(0); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Border Flow Animation */
        @keyframes flowBorderAnim {
            0% { background-position: 0 0, 10px 10px, 0 0, 0% 50%; }
            100% { background-position: 0 0, 10px 10px, 0 0, 100% 50%; }
        }

        /* Shine Effect Overlay */
        .card::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            z-index: 1;
            pointer-events: none;
        }
        .card.active::after {
            animation: shineMove 3s infinite 1.5s;
        }
        @keyframes shineMove {
            0% { left: -100%; opacity: 0; }
            50% { opacity: 1; }
            100% { left: 200%; opacity: 0; }
        }

        /* Staggered Text Animations */
        .card.active .card-icon { animation: slideUpFade 0.5s ease-out 0.2s forwards; opacity: 0; }
        .card.active h2 { animation: slideUpFade 0.5s ease-out 0.4s forwards; opacity: 0; }
        .card.active .wish-text { animation: zoomInText 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.6s forwards; opacity: 0; transform: scale(0.5); }
        .card.active .sub-text, .card.active p { animation: slideUpFade 0.5s ease-out 0.8s forwards; opacity: 0; }
        .card.active .signature { animation: slideUpFade 0.5s ease-out 0.9s forwards; opacity: 0; }

        @keyframes slideUpFade {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes zoomInText {
            from { transform: scale(0.5) skew(-5deg); opacity: 0; }
            to { transform: scale(1) skew(-5deg); opacity: 1; }
        }

        /* --- Typography --- */
        h1 {
            font-family: 'Rozha One', serif;
            font-size: clamp(2rem, 5vw, 2.5rem);
            color: var(--pop-pink);
            text-shadow: 2px 2px 0px var(--pop-yellow);
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .wish-text {
            font-family: 'Rozha One', serif;
            font-size: clamp(2.2rem, 8vw, 3rem);
            color: var(--pop-purple);
            text-shadow: 3px 3px 0px var(--pop-blue);
            transform: skew(-5deg);
            margin: 15px 0;
            border-top: 3px solid var(--pop-orange);
            border-bottom: 3px solid var(--pop-orange);
            padding: 10px 0;
            display: inline-block;
            line-height: 1.1;
            width: 100%;
        }

        .sub-text {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #444;
        }

        /* --- Advance Text Animation --- */
        @keyframes colorCycle {
            0% { color: var(--pop-blue); text-shadow: 2px 2px 0 var(--pop-pink); }
            25% { color: var(--pop-pink); text-shadow: 2px 2px 0 var(--pop-yellow); }
            50% { color: var(--pop-yellow); text-shadow: 2px 2px 0 var(--pop-orange); }
            75% { color: var(--pop-orange); text-shadow: 2px 2px 0 var(--pop-blue); }
            100% { color: var(--pop-blue); text-shadow: 2px 2px 0 var(--pop-pink); }
        }

        @keyframes playfulMove {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            25% { transform: translateY(-3px) scale(1.1) rotate(-3deg); }
            75% { transform: translateY(-1px) scale(1.05) rotate(3deg); }
        }

        .advance-text {
            font-size: 0.5em;
            display: block;
            animation: colorCycle 0.8s steps(4) infinite, playfulMove 1s ease-in-out infinite;
            font-weight: bold;
            margin-top: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- Vibe Selector --- */
        .vibe-section { margin-bottom: 20px; }
        .vibe-label {
            font-size: 0.8rem; color: #666; margin-bottom: 5px; font-weight: bold; text-transform: uppercase;
        }
        .vibe-options { display: flex; justify-content: center; gap: 10px; }
        .vibe-dot {
            width: 30px; height: 30px;
            border-radius: 50%; border: 2px solid #000;
            cursor: pointer; transition: transform 0.2s;
        }
        .vibe-dot.active { transform: scale(1.2); border-width: 3px; box-shadow: 0 0 5px rgba(0,0,0,0.5); }

        /* --- Inputs --- */
        input[type="text"] {
            width: 100%; padding: 12px;
            border: 3px solid var(--pop-blue);
            background: #f0faff;
            font-family: 'Poppins', sans-serif;
            font-weight: 600; font-size: 1.1rem;
            text-align: center; margin-bottom: 1.5rem;
            outline: none; box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        input[type="text"]:focus {
            background: #fff; transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px var(--pop-blue);
        }

        /* --- Buttons --- */
        .btn {
            background: var(--pop-pink); color: white;
            padding: 12px 25px; border: 3px solid #000;
            font-family: 'Rozha One', serif; font-size: 1.1rem;
            cursor: pointer; text-decoration: none;
            display: inline-block; margin: 5px;
            box-shadow: 5px 5px 0px #000;
            transition: all 0.1s; text-transform: uppercase;
            width: 100%; /* Full width on mobile for better touch */
            max-width: 250px;
        }
        .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000; }
        .btn-secondary { background: var(--pop-blue); color: #000; }

        .razorpay-payment-button {
            background: var(--pop-yellow) !important; color: #000 !important;
            border: 3px solid #000 !important; border-radius: 0 !important;
            padding: 8px 20px !important; font-family: 'Rozha One', serif !important;
            box-shadow: 4px 4px 0 #000 !important; min-height: 45px;
            transition: 0.1s !important;
        }

        /* --- Footer --- */
        .footer-credit {
            position: fixed; top: 10px; right: 10px; z-index: 100;
            background: #000; color: var(--pop-yellow);
            padding: 4px 8px; font-size: 0.7rem;
            font-weight: bold; transform: rotate(2deg);
            pointer-events: auto;
        }
        .footer-credit a { color: var(--pop-pink); text-decoration: none; }

        .footer-support {
            position: fixed; bottom: 20px; left: 20px; z-index: 100;
            pointer-events: auto;
        }

        .action-buttons {
            position: fixed; bottom: 80px; width: 100%;
            display: none; justify-content: center; gap: 10px;
            z-index: 90; pointer-events: auto;
            flex-wrap: wrap; /* Allow wrapping on very small screens */
            padding: 0 20px;
        }
        .action-buttons.visible { display: flex; }

        /* --- Overlays --- */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--pop-blue);
            z-index: 100; display: flex; justify-content: center; align-items: center;
            flex-direction: column; opacity: 0; pointer-events: none; transition: 0.5s;
        }
        .overlay.visible { opacity: 1; pointer-events: all; }
        
        .loader-kite { font-size: 3rem; color: var(--pop-pink); animation: bounce 0.5s infinite alternate; }
        @keyframes bounce { to { transform: translateY(-20px); } }

        #toast {
            visibility: hidden; min-width: 250px; margin-left: -125px;
            background-color: #000; color: var(--pop-yellow);
            text-align: center; border: 3px solid var(--pop-pink);
            padding: 12px; position: fixed; z-index: 1000; left: 50%; bottom: 30px;
            font-weight: bold; font-family: 'Poppins'; box-shadow: 5px 5px 0 var(--pop-pink);
            font-size: 0.9rem;
        }
        #toast.show { visibility: visible; bottom: 120px; }

        /* Mobile Layout Fixes */
        @media (max-width: 600px) {
            .card { 
                width: 90%; 
                top: 50px; 
                padding: 1.5rem 1rem; 
                max-height: calc(100vh - 160px); 
            }
            #wishPage { padding-bottom: 2rem; }
            .card-icon { margin-bottom: 5px; font-size: 1.5rem; }
            .wish-text { margin: 10px 0; font-size: 2rem; }
            .sub-text { margin-bottom: 1rem; font-size: 0.9rem; }
            .btn { padding: 10px 20px; font-size: 0.9rem; margin-bottom: 10px; }
            .action-buttons { bottom: 65px; }
            .footer-support { bottom: 10px; left: 10px; transform: scale(0.8); transform-origin: bottom left; }
            .signature { margin-top: 10px; padding: 5px 10px; font-size: 0.9rem; display: block; }
        }
    </style>
</head>
<body>

    <!-- Toran Decoration -->
    <div class="toran-container">
        <div class="toran-piece"></div><div class="toran-piece"></div><div class="toran-piece"></div>
        <div class="toran-piece"></div><div class="toran-piece"></div><div class="toran-piece"></div>
        <div class="toran-piece"></div><div class="toran-piece"></div><div class="toran-piece"></div>
        <div class="toran-piece"></div><div class="toran-piece"></div><div class="toran-piece"></div>
    </div>

    <canvas id="skyCanvas"></canvas>

    <!-- Loader -->
    <div class="overlay" id="loadingOverlay">
        <div class="loader-kite"><i class="fas fa-gem"></i></div>
        <h2 style="font-family: 'Rozha One'; color: #000;">Sajaoing...</h2>
    </div>

    <div id="toast">Link Copied!</div>

    <div class="footer-credit">
        DESIGN: <a href="https://www.webfxgen.in/" target="_blank">WEBFXGEN</a>
    </div>

    <div class="container" id="cardContainer">
        <!-- Input Page -->
        <div class="card active" id="inputPage">
            <i class="fas fa-sun" style="font-size: 2rem; color: var(--pop-orange); margin-bottom: 10px; animation: spinSlow 5s infinite linear;"></i>
            <h1>Patang Utsav!</h1>
            
            <div class="vibe-section">
                <div class="vibe-label">Choose your Vibe:</div>
                <div class="vibe-options">
                    <div class="vibe-dot active" style="background: #FF007F;" onclick="setTheme('#FF007F', this)"></div>
                    <div class="vibe-dot" style="background: #FF5E00;" onclick="setTheme('#FF5E00', this)"></div>
                    <div class="vibe-dot" style="background: #32ff7e;" onclick="setTheme('#32ff7e', this)"></div>
                </div>
            </div>

            <p class="sub-text">Chalo, let's fly some kites!</p>
            <input type="text" id="userNameInput" placeholder="Aap ka Naam..." autocomplete="off">
            <button class="btn" onclick="generateWish()">Start Fun</button>
        </div>

        <!-- Wish Page -->
        <div class="card" id="wishPage">
            <div class="card-icon" style="font-size: 1.8rem; color: var(--pop-orange); margin-bottom: 5px;">
                <i class="fas fa-om"></i>
            </div>
            <h2 style="font-size: 1rem; color: #666; text-transform: uppercase; letter-spacing: 2px; margin-bottom:0;">Shubh</h2>
            
            <!-- Wish Title (Dynamic) -->
            <div class="wish-text" id="wishTitle">Makar Sankranti</div>
            
            <p class="sub-text" style="margin-bottom: 10px;">
                "Life is like a kite... sometimes loose, sometimes tight! Enjoy the flight!"
            </p>
            <p style="color: var(--pop-pink); font-size: 1.1rem; font-weight: bold; font-family: 'Rozha One';">
                Til-Gul Ghya, God God Bola!
            </p>
            
            <div class="signature">
                <div style="margin-top: 15px; font-weight: 600; background: var(--pop-yellow); display: inline-block; padding: 5px 15px; transform: rotate(-2deg); border: 2px solid #000;">
                    Dil Se,<br>
                    <span style="text-transform: uppercase; color: #000;" id="displaySenderName">User</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="action-buttons" id="actionButtons">
        <button class="btn" style="flex:1;" onclick="shareWish()">Share Karo</button>
        <button class="btn btn-secondary" style="flex:1;" onclick="resetApp()">New Karo</button>
    </div>

    <div class="footer-support">
        <form>
            <script src="https://checkout.razorpay.com/v1/payment-button.js" data-payment_button_id="pl_S0CCnxIwut7hNL" async> </script> 
        </form>
    </div>

    <script>
        // --- Canvas ---
        const canvas = document.getElementById('skyCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let kites = [];
        const colors = ['#FF007F', '#FFD700', '#00E5FF', '#FF5E00', '#8A2BE2'];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class DesiKite {
            constructor(isBurst) {
                this.x = Math.random() * width;
                this.y = isBurst ? height / 2 : height + 100;
                this.size = Math.random() * 30 + 20;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.speedY = isBurst ? -(Math.random() * 8 + 3) : -(Math.random() * 2 + 1);
                this.speedX = (Math.random() - 0.5) * 2;
                this.wobble = Math.random() * Math.PI * 2;
                this.drag = isBurst ? 0.98 : 1;
            }

            update() {
                this.x += this.speedX + Math.sin(this.wobble) * 0.5;
                this.y += this.speedY; 
                this.wobble += 0.1;
                this.speedX *= this.drag;
                
                if (this.drag === 1 && this.y < -50) {
                    this.y = height + 50;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                const rotation = (Math.sin(this.wobble) * 0.2);
                ctx.rotate(rotation + Math.PI/4);
                
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.rect(-this.size/2, -this.size/2, this.size, this.size);
                ctx.fill();
                
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#000';
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, 0, this.size/4, 0, Math.PI*2);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, this.size/1.5);
                ctx.lineTo(-5, this.size + 15);
                ctx.lineTo(5, this.size + 15);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }
        }

        function initKites(count, isBurst = false) {
            for (let i = 0; i < count; i++) {
                kites.push(new DesiKite(isBurst));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            kites = kites.filter(k => k.y < height + 200);
            kites.forEach(k => {
                k.update();
                k.draw();
            });
            requestAnimationFrame(animate);
        }

        initKites(20);
        animate();

        // --- Logic ---
        function updateGreeting() {
            const today = new Date();
            const month = today.getMonth(); 
            const date = today.getDate();
            
            let titleHTML = "Makar Sankranti";
            // Check for before 14th Jan
            if (month === 0 && date < 14) {
                titleHTML += "<br><span class='advance-text'>In Advance!</span>";
            }
            document.getElementById('wishTitle').innerHTML = titleHTML;
        }

        function setTheme(color, el) {
            document.documentElement.style.setProperty('--pop-pink', color);
            if(el) {
                document.querySelectorAll('.vibe-dot').forEach(d => d.classList.remove('active'));
                el.classList.add('active');
            }
        }

        function generateWish() {
            const name = document.getElementById('userNameInput').value.trim();
            if(!name) {
                showToast("Please enter your name!");
                return;
            }

            document.getElementById('loadingOverlay').classList.add('visible');
            document.getElementById('inputPage').classList.remove('active');

            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.remove('visible');
                document.getElementById('displaySenderName').innerText = name;
                updateGreeting();
                
                const wishPage = document.getElementById('wishPage');
                wishPage.style.display = 'block';
                document.getElementById('actionButtons').classList.add('visible');
                void wishPage.offsetWidth;
                wishPage.classList.add('active');

                initKites(50, true);
            }, 1000);
        }

        function resetApp() {
            try {
               const newUrl = window.location.href.split('?')[0];
               window.history.pushState({}, document.title, newUrl);
            } catch (e) {}

            document.getElementById('wishPage').classList.remove('active');
            document.getElementById('actionButtons').classList.remove('visible');
            
            setTimeout(() => {
                document.getElementById('wishPage').style.display = 'none';
                const inputPage = document.getElementById('inputPage');
                inputPage.style.display = 'block';
                inputPage.classList.add('active');
                document.getElementById('userNameInput').value = '';
                kites = [];
                initKites(20);
            }, 500);
        }

        async function shareWish() {
            const name = document.getElementById('displaySenderName').innerText;
            const baseUrl = window.location.href.split('?')[0];
            const shareUrl = `${baseUrl}?n=${encodeURIComponent(name)}`;
            
            const text = `Namaste! 🙏\n\n${name} has sent you a special & colorful Makar Sankranti wish! 🪁✨\n\nSee your surprise here: 👇`;

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Happy Makar Sankranti',
                        text: text,
                        url: shareUrl
                    });
                } catch (err) {}
            } else {
                copyToClipboard(`${text}\n${shareUrl}`);
            }
        }

        function copyToClipboard(text) {
            const tempInput = document.createElement("textarea");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            showToast("Link Copied!");
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const sharedName = urlParams.get('n');

            if (sharedName) {
                const decodedName = decodeURIComponent(sharedName);
                document.getElementById('inputPage').classList.remove('active');
                document.getElementById('displaySenderName').innerText = decodedName;
                updateGreeting();
                
                const wishPage = document.getElementById('wishPage');
                wishPage.style.display = 'block';
                document.getElementById('actionButtons').classList.add('visible');

                setTimeout(() => {
                    wishPage.classList.add('active');
                    initKites(50, true);
                }, 100);
            }
        });
    </script>
</body>
</html>
